# Kachina wx: builds the weather data on GitHub's servers and publishes it with GitHub Pages.
# No Mac, no Chrome, no logins. Runs at 0350, 0950, 1550 and 2150 Pacific (DST-safe).
name: kachina-wx

on:
  schedule:
    - cron: "50 4,5,10,11,16,17,22,23 * * *"   # UTC; the gate below keeps only the Pacific hours we want
  workflow_dispatch: {}                          # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: kachina-wx
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pacific-time gate
        id: gate
        run: |
          H=$(TZ=America/Los_Angeles date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "$H" =~ ^(03|09|15|21)$ ]]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"; echo "Skipping, Pacific hour is $H"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'yes'
        with:
          python-version: "3.12"

      - name: Build weather data
        if: steps.gate.outputs.run == 'yes'
        run: python kachina_wx.py --out . || true

      - name: Publish
        if: steps.gate.outputs.run == 'yes'
        run: |
          cat run_report.json || true
          git config user.name  "Kachina"
          git config user.email "kachina@users.noreply.github.com"
          git add -A *.json
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -m "Kachina wx $(TZ=America/Los_Angeles date +'%Y-%m-%d %H%M')"
          git push
