# Kachina Winter Desk: builds the shared weather-page snapshot on GitHub's servers
# and publishes it with GitHub Pages (https://cooptahoe.github.io/kachina-wx/snapshot.json).
# No Mac, no Chrome, no Squarespace admin. Replaces the 13 Oct 2026 workflow.
#
# Runs at 0350, 0950, 1550 and 2150 Pacific with a backup slot 30 minutes earlier
# (0320, 0920, 1520, 2120), because GitHub sometimes drops or delays a scheduled run.
# DST-safe: cron is UTC, the gate keeps only the Pacific hours we want.
name: kachina-wx

on:
  schedule:
    - cron: "20,50 4,5,10,11,16,17,22,23 * * *"
  workflow_dispatch:
    inputs:
      seed_from_page:
        description: "Start from the live CMM page snapshot (first run only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: kachina-wx
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Pacific-time gate
        id: gate
        run: |
          H=$(TZ=America/Los_Angeles date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "$H" =~ ^(03|09|15|21)$ ]]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"; echo "Skipping, Pacific hour is $H"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'yes'
        with:
          python-version: "3.12"

      - name: Offline tests
        if: steps.gate.outputs.run == 'yes'
        run: python -m unittest discover -s tests

      - name: Build snapshot
        id: build
        if: steps.gate.outputs.run == 'yes'
        env:
          WB_USERNAME: ${{ secrets.WB_USERNAME }}
          WB_PASSWORD: ${{ secrets.WB_PASSWORD }}
        run: |
          SEED=""
          if [ "${{ inputs.seed_from_page }}" = "true" ]; then SEED="--seed page"; fi
          set +e
          python winterdesk.py --out . $SEED
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish
        if: steps.gate.outputs.run == 'yes'
        run: |
          cat health.json || true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot.json health.json
          if git diff --cached --quiet; then echo "No change"; else
            git commit -m "Winter Desk snapshot $(TZ=America/Los_Angeles date +'%Y-%m-%d %H%M')"
            for i in 1 2 3; do git push && break; git pull --rebase; done
          fi

      - name: Turn the run red if any part failed
        if: steps.gate.outputs.run == 'yes' && steps.build.outputs.rc != '0'
        run: |
          echo "winterdesk.py exit code ${{ steps.build.outputs.rc }} (1 = a part kept its old value, 2 = nothing published). See health.json."
          exit 1
